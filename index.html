<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="Football Tracker">

<title>Football Play Tracker</title>

<style>

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}

body {

    margin: 0;

    background: #f2f2f7;

    color: #111;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;

}

.header {

    background: #111;

    color: white;

    text-align: center;

    padding: 16px 12px;

    position: sticky;

    top: 0;

    z-index: 100;

}

.header h1 {

    margin: 0;

    font-size: 24px;

}

.header p {

    margin: 4px 0 0;

    font-size: 13px;

    opacity: .75;

}

.container {

    max-width: 900px;

    margin: auto;

    padding: 12px 12px 50px;

}

.tabs {

    display: grid;

    grid-template-columns: repeat(3,1fr);

    gap: 7px;

    margin-bottom: 12px;

}

.tab {

    border: 0;

    border-radius: 12px;

    padding: 13px 5px;

    background: #d9d9de;

    font-size: 14px;

    font-weight: 800;

}

.tab.active {

    background: #111;

    color: white;

}

.card {

    background: white;

    border-radius: 16px;

    padding: 14px;

    margin-bottom: 12px;

    box-shadow: 0 2px 8px rgba(0,0,0,.08);

}

.card h2 {

    margin: 0 0 12px;

    font-size: 19px;

}

.stats {

    display: grid;

    grid-template-columns: repeat(3,1fr);

    gap: 7px;

    margin-bottom: 12px;

}

.stat {

    background: #f2f2f7;

    border-radius: 12px;

    text-align: center;

    padding: 10px 4px;

}

.stat-number {

    font-size: 23px;

    font-weight: 900;

}

.stat-label {

    color: #777;

    font-size: 10px;

    font-weight: 700;

}

select,

input {

    width: 100%;

    height: 50px;

    border: 1px solid #c7c7cc;

    border-radius: 11px;

    background: white;

    padding: 0 10px;

    font-size: 16px;

}

.form {

    display: grid;

    grid-template-columns: 1fr;

    gap: 8px;

}

.add-button {

    height: 50px;

    border: 0;

    border-radius: 11px;

    background: #111;

    color: white;

    font-size: 17px;

    font-weight: 800;

}

.play {

    display: grid;

    grid-template-columns: 32px 1fr 50px 36px;

    gap: 7px;

    align-items: center;

    min-height: 67px;

    border-bottom: 1px solid #eee;

}

.play-number {

    color: #888;

    text-align: center;

    font-weight: 800;

}

.play-name {

    font-size: 14px;

    font-weight: 800;

}

.play-player {

    color: #777;

    font-size: 11px;

    margin-top: 2px;

}

.play-yards {

    text-align: right;

    font-size: 19px;

    font-weight: 900;

}

.delete-button {

    width: 34px;

    height: 34px;

    border: 0;

    border-radius: 50%;

    background: #eee;

    font-size: 20px;

}

.empty {

    text-align: center;

    padding: 25px 5px;

    color: #888;

}

.table-wrap {

    overflow-x: auto;

}

table {

    width: 100%;

    border-collapse: collapse;

}

th,

td {

    padding: 9px 5px;

    border-bottom: 1px solid #eee;

    text-align: center;

    font-size: 13px;

}

th {

    color: #777;

    font-size: 11px;

}

th:first-child,

td:first-child {

    text-align: left;

}

.average {

    font-weight: 900;

}

.controls {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;

}

.secondary {

    height: 46px;

    border: 0;

    border-radius: 11px;

    background: #e5e5ea;

    font-weight: 800;

}

.clear {

    width: 100%;

    height: 48px;

    margin-top: 8px;

    border: 0;

    border-radius: 11px;

    background: #e5e5ea;

    color: #d00;

    font-weight: 800;

}

.toast {

    position: fixed;

    bottom: 25px;

    left: 50%;

    transform: translateX(-50%);

    background: #111;

    color: white;

    padding: 12px 18px;

    border-radius: 25px;

    opacity: 0;

    pointer-events: none;

    transition: opacity .2s;

    z-index: 999;

}

.toast.show {

    opacity: 1;

}

@media (min-width: 650px) {

    .form {

        grid-template-columns: 1fr 1fr;

    }

    .add-button {

        grid-column: 1 / -1;

    }

}

</style>

</head>

<body>

<div class="header">

    <h1>🏈 Football Play Tracker</h1>

    <p>Play • Player • Yards • Average</p>

</div>

<div class="container">

<div class="tabs">

<button class="tab active"

        id="trackerTab"

        onclick="showSection('tracker')">

    📋 Tracker

</button>

<button class="tab"

        id="statsTab"

        onclick="showSection('stats')">

    📊 Stats

</button>

<button class="tab"

        id="playsTab"

        onclick="showSection('plays')">

    📖 Playbook

</button>

</div>

<!-- TRACKER -->

<section id="trackerSection">

<div class="card">

<h2>Add Play</h2>

<div class="stats">

<div class="stat">

<div class="stat-number" id="totalPlays">0</div>

<div class="stat-label">PLAYS</div>

</div>

<div class="stat">

<div class="stat-number" id="totalYards">0</div>

<div class="stat-label">YARDS</div>

</div>

<div class="stat">

<div class="stat-number" id="overallAverage">0.0</div>

<div class="stat-label">AVG</div>

</div>

</div>

<div class="form">

<select id="formation">

<option value="">Select Formation / Group</option>

</select>

<select id="play">

<option value="">Select Play</option>

</select>

<select id="player">

<option value="">Select Player</option>

</select>

<input

    id="yards"

    type="number"

    inputmode="decimal"

    step="0.1"

    placeholder="Yards gained"

>

<button

    class="add-button"

    onclick="addPlay()">

    + ADD PLAY

</button>

</div>

</div>

<div class="card">

<h2>Play History</h2>

<div id="history"></div>

</div>

</section>

<!-- STATS -->

<section id="statsSection" style="display:none;">

<div class="card">

<h2>Player Statistics</h2>

<div class="table-wrap">

<table>

<thead>

<tr>

<th>Player</th>

<th>Plays</th>

<th>Yards</th>

<th>Avg</th>

</tr>

</thead>

<tbody id="playerStats"></tbody>

</table>

</div>

</div>

<div class="card">

<h2>Play Statistics</h2>

<div class="table-wrap">

<table>

<thead>

<tr>

<th>Play</th>

<th>Times</th>

<th>Yards</th>

<th>Avg</th>

</tr>

</thead>

<tbody id="playStats"></tbody>

</table>

</div>

</div>

</section>

<!-- PLAYBOOK -->

<section id="playsSection" style="display:none;">

<div class="card">

<h2>Your Playbook</h2>

<div id="playbookDisplay"></div>

</div>

</section>

<!-- CONTROLS -->

<div class="card">

<h2>Game Controls</h2>

<div class="controls">

<button class="secondary"

        onclick="exportData()">

    Export

</button>

<button class="secondary"

        onclick="window.print()">

    Print

</button>

</div>

<button class="clear"

        onclick="clearAll()">

    Clear All Plays

</button>

</div>

</div>

<div id="toast" class="toast"></div>

<script>

/* =====================================================

   FULL 19-PLAYER ROSTER

   ===================================================== */

const players = [

    "#36 Althouse, Frank",

    "#12 Artrip, Carson",

    "#6 Beas, Kai",

    "#60 Boonstra, Brady",

    "#88 Coan, Jaxson",

    "#85 Cornwall, Jensen",

    "#54 Evans, Noah",

    "#32 Gillam, James",

    "#11 Hannah, Knox",

    "#1 Hendrix, Cash",

    "#28 Lawson, Briot",

    "#2 McClurg, Ezra",

    "#7 Rayls, Warren",

    "#34 Scott, Noah",

    "#3 Smith, Carson",

    "#5 Whitacre, Gavin",

    "#4 Word, Gavin",

    "#77 Harrison, Isaiah",

    "#23 Young, Ethan"

];

/* =====================================================

   YOUR PLAYBOOK

const playbook = {

    "(RT) 21 IZ / (LT) 22 IZ",

    "(RT) 24 Dive Lead K / (LT) 23 Dive Lead K",

    "(RT) 23 F Trap / (LT) 24 F Trap",

    "(RT) 30 Hitch / (LT) 30 Hitch",

    "(RT) 28 Toss / (LT) 27 Toss",

    "F Middle Screen",

    "(RT) 26 OZ / (LT) 25 OZ",

    "(RT) 30 Fade / (LT) 30 Fade",

    "(RT) 50 PoP Pass / (LT) 50 PoP Pass",

    "(RT) 30 Out / (LT) 30 Out",

    "(RT) 30 Slap / (LT) 30 Slap",

    "(RT) 50 Slip Pass / (LT) 50 Slip Pass",

    "(RT) 38 Jet Sweep Load / (LT) 47 Jet Sweep Lead"

],

    "(RT) 26 OZ / (LT) 25 OZ",

    "(RT) 24 Trap / (LT) 23 Trap",

    "(RT) 28 Toss / (LT) 27 Toss",

    "22 IZ Right / 21 IZ Left",

    "26 OZ Right / 25 OZ Left"

],

"Doubles (C)": [

    "(RT) 24 Dive Lead / (LT) 23 Dive Lead",

    "(RT) 23 H Trap / (LT) 24 H Trap",

    "(RT) 26 OZ / (LT) 25 OZ",

    "(RT) 28 Toss / (LT) 27 Toss",

    "(RT) 50 PoP Pass / (LT) 50 PoP Pass",

    "(RT) 50 Slip Pass / (LT) 50 Slip Pass"

],

"Trio (D)": [

    "(RT) Heavy 22 Blast / (LT) Heavy 21 Blast",

    "(RT) Heavy 22 Blast K / (RT) 21 Blast K",

    "(RT) 50 Mesh / (LT) 50 Mesh",

    "(RT) Shield Screen / (LT) Shield Screen",

    "(RT) 50Y Corner / (LT) 50Y Corner"

],

"Trips (D)": [

    "(RT) Louey 30 Slap / (LT) Rexy 30 Slap",

    "(RT) Louey 30 Fade / (LT) Rexy 30 Fade",

    "(RT) Louey 30 Wheel / (LT) Rexy 30 Wheel",

    "(RT) Louey 30 Vegas / (LT) Rexy 30 Vegas",

    "(RT) Jet L F Swing / (LT) Jet R F Swing",

    "(RT) 30 Hitch / (LT) 30 Hitch",

    "(RT) 30 Slap / (LT) 30 Slap",

    "(RT) 30 Fade / (LT) 30 Fade",

    "(RT) 30 Vegas / (LT) 30 Vegas",

    "(RT) 50 Hitch / (LT) 50 Hitch",

    "(RT) 50 Slap / (LT) 50 Slap",

    "(RT) 50 Fade / (LT) 50 Fade",

    "(RT) 50 Vegas / (LT) 50 Vegas",

    "(RT) 50 F Screen / (LT) 50 F Screen",

    "(RT) Z Jailbreak / (LT) X Jailbreak",

    "(RT) 80 Flood / (LT) 81 Flood",

    "(RT) 80 Out / (LT) 81 Out"

],

"30 Series": [

    "30 Hitch",

    "30 Fade",

    "30 Out",

    "30 Slap",

    "30 Bubble",

    "30 Wheel",

    "(RT) 30 Hitch / (LT) 30 Hitch",

    "(RT) 30 Slap / (LT) 30 Slap",

    "(RT) 30 Fade / (LT) 30 Fade",

    "(RT) 30 Vegas / (LT) 30 Vegas",

    "Rexy 30 Fade / Louey 30 Fade",

    "Rexy 30 Vegas / Louey 30 Vegas",

    "Rexy 30 Slap / Louey 30 Slap"

],

"50 Series": [

    "(RT) 50 Hitch / (LT) 50 Hitch",

    "(RT) 50 Fade / (LT) 50 Fade",

    "(RT) 50 Out / (LT) 50 Out",

    "(RT) 50 Slap / (LT) 50 Slap",

    "(RT) 50 Wheel / (LT) 50 Wheel",

    "(RT) 50 Vegas / (LT) 50 Vegas",

    "50 Hitch",

    "50 Fade",

    "50 Out",

    "50 Slap",

    "50 Wheel",

    "50 Vegas",

    "50 Hitch and Go",

    "(RT) 50Y Corner / (LT) 50Y Corner",

    "(RT) 50 Mesh / (LT) 50 Mesh",

    "(RT) Shield Screen / (LT) Shield Screen",

    "(RT) F Screen / (LT) F Screen",

    "(RT) Z Jailbreak / (LT) X Jailbreak"

],

"80/81 Series": [

    "(RT) 80 Hitch / (LT) 81 Hitch",

    "(RT) 80 Fade / (LT) 81 Fade",

    "(RT) 80 Out / (LT) 81 Out",

    "(RT) 80Y Corner / (LT) 81Y Corner",

    "Rexy 80 Flood / Louey 81 Flood",

    "(RT) 80 Flood / (LT) 81 Flood"

],

"Motion Run": [

    "Jet RT 23 Trap / Jet LT 24 Trap",

    "38 Jet Sweep RT / 47 Jet Sweep LT",

    "38 Jet Sweep RT Load / 47 Jet Sweep LT Lead",

    "(RT) 22 Dive RT / (LT) 21 Dive L",

    "(RT) 28 Toss / (LT) 27 Toss",

    "(RT) Zoom R / (LT) Zoom L",

    "Doubles F Toss Vegas",

    "Doubles 27 Toss Reverse RT"

],

"Motion Pass": [

    "Rexy 80 Flood / Louey 81 Flood",

    "Rexy 30 Fade / Louey 30 Fade",

    "Rexy 30 Vegas / Louey 30 Vegas",

    "Rexy 30 Slap / Louey 30 Slap",

    "(RT) 50 Hitch / (LT) 50 Hitch",

    "(RT) 50 Fade / (LT) 50 Fade",

    "(RT) 50 Out / (LT) 50 Out",

    "(RT) 50 Vegas / (LT) 50 Vegas",

    "(RT) Jet L F Swing / (LT) Jet R F Swing"

],

"Base Run": [

    "(RT) 22 Dive RT / (LT) 21 Dive L",

    "(RT) 28 Toss / (LT) 27 Toss",

    "(RT) Zoom R / (LT) Zoom L",

    "Doubles F Toss Vegas",

    "Doubles 27 Toss Reverse RT"

],

"Script": [

    "1st and 2nd Half Script"

],

"Other": [

    "Doubles Pass Double Pass"

]

};

/* =====================================================

   SAVED PLAYS

   ===================================================== */

let plays = [];

try {

    const saved =

        localStorage.getItem("footballTrackerData");

    if (saved) {

        plays = JSON.parse(saved);

    }

    if (!Array.isArray(plays)) {

        plays = [];

    }

} catch (e) {

    plays = [];

}

/* =====================================================

   LOAD FORMATIONS

   ===================================================== */

function loadFormations() {

    const select =

        document.getElementById("formation");

    Object.keys(playbook).forEach(function(group) {

        const option =

            document.createElement("option");

        option.value = group;

        option.textContent = group;

        select.appendChild(option);

    });

}

/* =====================================================

   LOAD PLAYS

   ===================================================== */

function loadPlays() {

    const formation =

        document.getElementById("formation").value;

    const select =

        document.getElementById("play");

    select.innerHTML =

        '<option value="">Select Play</option>';

    if (!formation) return;

    playbook[formation].forEach(function(playName) {

        const option =

            document.createElement("option");

        option.value = playName;

        option.textContent = playName;

        select.appendChild(option);

    });

}

/* =====================================================

   LOAD ALL 19 PLAYERS

   ===================================================== */

function loadPlayers() {

    const select =

        document.getElementById("player");

    players.forEach(function(playerName) {

        const option =

            document.createElement("option");

        option.value = playerName;

        option.textContent = playerName;

        select.appendChild(option);

    });

}

/* =====================================================

   ADD PLAY

   ===================================================== */

function addPlay() {

    const formation =

        document.getElementById("formation").value;

    const play =

        document.getElementById("play").value;

    const player =

        document.getElementById("player").value;

    const yards =

        parseFloat(

            document.getElementById("yards").value

        );

    if (!formation) {

        toast("Select a formation.");

        return;

    }

    if (!play) {

        toast("Select a play.");

        return;

    }

    if (!player) {

        toast("Select a player.");

        return;

    }

    if (isNaN(yards)) {

        toast("Enter yards gained.");

        return;

    }

    plays.push({

        id: Date.now() + Math.random(),

        formation: formation,

        play: play,

        player: player,

        yards: yards,

        time: new Date().toISOString()

    });

    save();

    document.getElementById("yards").value = "";

    toast("Play added.");

}

/* =====================================================

   SAVE

   ===================================================== */

function save() {

    localStorage.setItem(

        "footballTrackerData",

        JSON.stringify(plays)

    );

    render();

}

/* =====================================================

   RENDER EVERYTHING

   ===================================================== */

function render() {

    renderHistory();

    updateTotals();

    renderPlayerStats();

    renderPlayStats();

}

/* =====================================================

   HISTORY

   ===================================================== */

function renderHistory() {

    const history =

        document.getElementById("history");

    if (plays.length === 0) {

        history.innerHTML =

            '<div class="empty">No plays recorded yet.</div>';

        return;

    }

    history.innerHTML = "";

    plays.slice().reverse().forEach(function(item, index) {

        const row =

            document.createElement("div");

        row.className = "play";

        const number =

            document.createElement("div");

        number.className = "play-number";

        number.textContent =

            plays.length - index;

        const info =

            document.createElement("div");

        const name =

            document.createElement("div");

        name.className = "play-name";

        name.textContent = item.play;

        const player =

            document.createElement("div");

        player.className = "play-player";

        player.textContent =

            item.player + " • " + item.formation;

        info.appendChild(name);

        info.appendChild(player);

        const yards =

            document.createElement("div");

        yards.className = "play-yards";

        yards.textContent =

            format(item.yards);

        const remove =

            document.createElement("button");

        remove.className =

            "delete-button";

        remove.textContent = "×";

        remove.onclick =

            function() {

                deletePlay(item.id);

            };

        row.appendChild(number);

        row.appendChild(info);

        row.appendChild(yards);

        row.appendChild(remove);

        history.appendChild(row);

    });

}

/* =====================================================

   TOTALS

   ===================================================== */

function updateTotals() {

    const count = plays.length;

    const total =

        plays.reduce(

            function(sum, item) {

                return sum + Number(item.yards);

            },

            0

        );

    const average =

        count ? total / count : 0;

    document.getElementById("totalPlays")

        .textContent = count;

    document.getElementById("totalYards")

        .textContent = format(total);

    document.getElementById("overallAverage")

        .textContent = average.toFixed(1);

}

/* =====================================================

   PLAYER STATS

   ===================================================== */

function renderPlayerStats() {

    const table =

        document.getElementById("playerStats");

    table.innerHTML = "";

    players.forEach(function(player) {

        const playerPlays =

            plays.filter(function(item) {

                return item.player === player;

            });

        const total =

            playerPlays.reduce(

                function(sum, item) {

                    return sum + Number(item.yards);

                },

                0

            );

        const average =

            playerPlays.length

                ? total / playerPlays.length

                : 0;

        const row =

            document.createElement("tr");

        row.innerHTML =

            "<td>" + escapeHTML(player) + "</td>" +

            "<td>" + playerPlays.length + "</td>" +

            "<td>" + format(total) + "</td>" +

            "<td class='average'>" +

            average.toFixed(1) +

            "</td>";

        table.appendChild(row);

    });

}

/* =====================================================

   PLAY STATS

   ===================================================== */

function renderPlayStats() {

    const table =

        document.getElementById("playStats");

    table.innerHTML = "";

    const grouped = {};

    plays.forEach(function(item) {

        if (!grouped[item.play]) {

            grouped[item.play] = {

                count: 0,

                yards: 0

            };

        }

        grouped[item.play].count++;

        grouped[item.play].yards +=

            Number(item.yards);

    });

    Object.keys(grouped).forEach(function(playName) {

        const data =

            grouped[playName];

        const average =

            data.yards / data.count;

        const row =

            document.createElement("tr");

        row.innerHTML =

            "<td>" + escapeHTML(playName) + "</td>" +

            "<td>" + data.count + "</td>" +

            "<td>" + format(data.yards) + "</td>" +

            "<td class='average'>" +

            average.toFixed(1) +

            "</td>";

        table.appendChild(row);

    });

}

/* =====================================================

   DELETE PLAY

   ===================================================== */

function deletePlay(id) {

    plays =

        plays.filter(function(item) {

            return item.id !== id;

        });

    save();

    toast("Play deleted.");

}

/* =====================================================

   CLEAR ALL

   ===================================================== */

function clearAll() {

    if (!plays.length) {

        toast("No plays to clear.");

        return;

    }

    if (!confirm("Delete all plays from this game?")) {

        return;

    }

    plays = [];

    save();

    toast("All plays cleared.");

}

/* =====================================================

   SECTION SWITCHING

   ===================================================== */

function showSection(section) {

    document.getElementById("trackerSection")

        .style.display =

        section === "tracker" ? "block" : "none";

    document.getElementById("statsSection")

        .style.display =

        section === "stats" ? "block" : "none";

    document.getElementById("playsSection")

        .style.display =

        section === "plays" ? "block" : "none";

    document.getElementById("trackerTab")

        .classList.toggle(

            "active",

            section === "tracker"

        );

    document.getElementById("statsTab")

        .classList.toggle(

            "active",

            section === "stats"

        );

    document.getElementById("playsTab")

        .classList.toggle(

            "active",

            section === "plays"

        );

}

/* =====================================================

   DISPLAY PLAYBOOK

   ===================================================== */

function displayPlaybook() {

    const container =

        document.getElementById("playbookDisplay");

    container.innerHTML = "";

    Object.keys(playbook).forEach(function(group) {

        const title =

            document.createElement("h3");

        title.textContent = group;

        container.appendChild(title);

        playbook[group].forEach(function(play) {

            const item =

                document.createElement("div");

            item.style.padding = "7px 0";

            item.style.borderBottom = "1px solid #eee";

            item.textContent = play;

            container.appendChild(item);

        });

    });

}

/* =====================================================

   EXPORT

   ===================================================== */

function exportData() {

    if (!plays.length) {

        toast("No plays to export.");

        return;

    }

    let text =

        "FOOTBALL PLAY TRACKER\n\n";

    plays.forEach(function(item, index) {

        text +=

            (index + 1) +

            ". " +

            item.formation +

            " | " +

            item.play +

            " | " +

            item.player +

            " | " +

            item.yards +

            " yards\n";

    });

    const blob =

        new Blob(

            [text],

            {

                type:

                    "text/plain;charset=utf-8"

            }

        );

    const url =

        URL.createObjectURL(blob);

    const link =

        document.createElement("a");

    link.href = url;

    link.download =

        "football-play-tracker.txt";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    setTimeout(function() {

        URL.revokeObjectURL(url);

    }, 1000);

    toast("Export created.");

}

/* =====================================================

   HELPERS

   ===================================================== */

function format(number) {

    const value = Number(number);

    if (Number.isInteger(value)) {

        return String(value);

    }

    return value.toFixed(1);

}

function escapeHTML(text) {

    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}

let toastTimer;

function toast(message) {

    const element =

        document.getElementById("toast");

    element.textContent = message;

    element.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =

        setTimeout(function() {

            element.classList.remove("show");

        }, 1800);

}

        loadPlays

loadFormations();

loadPlayers();
