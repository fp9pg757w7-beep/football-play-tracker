<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Football Play Tracker</title>

<style>

*{box-sizing:border-box}

body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0f14;color:#fff}

header{padding:22px 18px 14px;text-align:center;background:#151b23;position:sticky;top:0;z-index:5}

h1{margin:0;font-size:27px}

.sub{color:#9da7b3;margin-top:5px;font-size:14px}

.tabs{display:flex;gap:8px;padding:12px;background:#151b23}

.tab{flex:1;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:700;background:#28303b;color:#fff}

.tab.active{background:#238636}

main{padding:14px;max-width:650px;margin:auto}

.card{background:#171d26;border:1px solid #29313d;border-radius:18px;padding:15px;margin-bottom:14px}

label{display:block;color:#aeb7c3;font-size:13px;margin:10px 0 6px}

select,input{width:100%;padding:14px;border-radius:12px;border:1px solid #394352;background:#0e1319;color:#fff;font-size:17px}

button{cursor:pointer}

.add{width:100%;margin-top:15px;padding:16px;border:0;border-radius:14px;background:#238636;color:#fff;font-size:18px;font-weight:800}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.stat{background:#10151c;border-radius:14px;padding:13px;text-align:center}

.stat b{display:block;font-size:24px}

.stat span{font-size:12px;color:#9da7b3
